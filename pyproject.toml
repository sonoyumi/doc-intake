[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-intake"
version = "0.1.0"
description = "Scans and PDFs of invoices, receipts and delivery notes become checked data: Claude reads the document, rules check totals, VAT and VAT numbers, a person reviews and approves, and the result goes to Excel"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Vladyslav Shokun", email = "sonoyumiii@gmail.com" }]
dependencies = [
    "anthropic>=1.0,<2",
    "aiosqlite>=0.20,<1",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0,<2",
    "pypdf>=5.0,<7",
    "pypdfium2>=4.30,<6",
    "pillow>=10.4,<13",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27,<1",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/sonoyumi/doc-intake"

[project.scripts]
doc-intake = "doc_intake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
doc_intake = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
