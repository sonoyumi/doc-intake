{% extends "base.html" %}
{% set active = 'users' %}
{% block title %}Users{% endblock %}
{% block content %}
<h1>Users</h1>
{% if flash %}<div class="note">{{ flash }}</div>{% endif %}
<table class="list">
  <thead><tr><th>Name</th><th>E-mail</th><th>Role</th></tr></thead>
  <tbody>{% for u in users %}<tr><td>{{ u.name }}</td><td>{{ u.email }}</td><td>{{ u.role }}</td></tr>{% endfor %}</tbody>
</table>
<form method="post" action="/users" class="card row wrap">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input name="name" placeholder="Name" required>
  <input name="email" type="email" placeholder="E-mail" required>
  <input name="password" type="password" placeholder="Password (10+ characters)" minlength="10" required>
  <select name="role"><option value="reviewer">reviewer</option><option value="admin">admin</option></select>
  <button class="primary">Add user</button>
</form>
{% endblock %}
